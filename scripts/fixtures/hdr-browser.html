<!doctype html><meta charset="utf-8"><title>HDR presentation probe</title>
<p>This fixture emulates HDR display capability; it does not test physical display brightness.</p>
<canvas id="hdr" width="2" height="2"></canvas><pre id="result">Ready</pre>
<script type="module">
import { HdrPlanes } from '/src/lib/hdr-planes.ts';
import { supportsHdr, drawHdr, hdrFrame, HDR_CHANGED, hdrPresentationPath } from '/src/lib/hdr.ts';
const originalMatchMedia = window.matchMedia.bind(window);
window.matchMedia = query => query === '(dynamic-range: high)' ? { matches: true } : originalMatchMedia(query);
let device;
const requestAdapter = navigator.gpu.requestAdapter.bind(navigator.gpu);
navigator.gpu.requestAdapter = async (...args) => {
  const adapter = await requestAdapter(...args);
  const requestDevice = adapter.requestDevice.bind(adapter);
  adapter.requestDevice = async (...args) => device = await requestDevice(...args);
  return adapter;
};
window.runNativeHdrProbe = async () => {
  const { NativeHdrPresenter } = await import('/src/lib/native-hdr.ts');
  const video = document.createElement('video'); document.body.append(video);
  const presenter = new NativeHdrPresenter(video, reason => { throw Error(reason); });
  const processor = new MediaStreamTrackProcessor({ track: video.srcObject.getVideoTracks()[0].clone() });
  const reader = processor.readable.getReader();
  let shownTimer;
  const shown = new Promise((resolve,reject) => {
    video.requestVideoFrameCallback(resolve);
    shownTimer = setTimeout(()=>reject(Error('native HDR playback timeout')),5000);
  });
  const words = new Uint16Array(32*32*3/2); words.fill(723,0,32*32); words.fill(512,32*32);
  const source = new VideoFrame(words, { format:'I420P10',codedWidth:32,codedHeight:32,timestamp:0,colorSpace:{primaries:'bt2020',transfer:'pq',matrix:'bt2020-ncl',fullRange:false} });
  const received = reader.read();
  try {
    await presenter.draw(source); source.close();
    const { value: frame } = await received;
    try {
      if (frame.format !== 'I420P10') throw Error('native stream lost 10-bit precision: '+frame.format);
      const bytes = new Uint8Array(frame.allocationSize()); const layout = await frame.copyTo(bytes);
      const samples = layout.map(p=>new DataView(bytes.buffer).getUint16(p.offset,true));
      if (samples.join(',') !== '723,512,512') throw Error('native stream changed HDR samples: '+samples);
      if (frame.colorSpace.transfer !== 'pq' || frame.colorSpace.primaries !== 'bt2020') throw Error('native stream lost HDR tags');
      await shown; clearTimeout(shownTimer);
      const displayed = new VideoFrame(video);
      const colorSpace = displayed.colorSpace.toJSON(); displayed.close();
      if (colorSpace.transfer !== 'pq' || colorSpace.primaries !== 'bt2020') throw Error('native playback lost HDR tags');
      return { ok:true, samples, colorSpace, width:video.videoWidth, height:video.videoHeight };
    } finally { frame.close(); }
  } finally { clearTimeout(shownTimer); source.close(); await reader.cancel(); presenter.destroy(); video.remove(); }
};
window.runHdrProbe = async (failure = "device") => {
  if (!await supportsHdr()) throw Error('HDR pipeline unavailable');
  const canvas = document.querySelector('canvas');
  const context = canvas.getContext('webgpu');
  const configure = context.configure.bind(context);
  context.configure = config => configure({ ...config, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  function half(word) {
    const sign = word & 32768 ? -1 : 1, exp = (word>>10)&31, frac = word&1023;
    return sign*(exp === 0 ? frac*2**-24 : (1+frac/1024)*2**(exp-15));
  }
  const samples = [];
  for (const rgb of [[203,203,203],[1000,1000,1000],[4000,4000,4000],[1000,100,20],[50,100,1500]]) {
    const nits=rgb[0];
    const pq=rgb.map(nits=>{
      const p=(nits/10000)**(2610/16384);
      return ((3424/4096+2413/128*p)/(1+2392/128*p))**(2523/32);
    });
    const y=.2627*pq[0]+.6780*pq[1]+.0593*pq[2];
    const words = new Uint16Array(6);
    words.fill(Math.round(64+876*y),0,4);
    words[4]=Math.round(512+896*(pq[2]-y)/1.8814);
    words[5]=Math.round(512+896*(pq[0]-y)/1.4746);
    const video = new VideoFrame(words,{format:'I420P10',codedWidth:2,codedHeight:2,timestamp:0,colorSpace:{primaries:'bt2020',transfer:'pq',matrix:'bt2020-ncl',fullRange:false}});
    const frame = hdrFrame(video);
    await drawHdr(canvas,frame);
    const output = context.getCurrentTexture();
    const buffer = device.createBuffer({size:512,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
    const encoder = device.createCommandEncoder();
    encoder.copyTextureToBuffer({texture:output},{buffer,bytesPerRow:256},{width:2,height:2});
    device.queue.submit([encoder.finish()]);
    await buffer.mapAsync(GPUMapMode.READ);
    const pixel = Array.from(new Uint16Array(buffer.getMappedRange()).slice(0,4),half);
    samples.push({nits,rgb,pixel,colorSpace:video.colorSpace.toJSON()});
    buffer.unmap();buffer.destroy();frame.close();
  }
  for (const sample of samples) {
    const matrix=[[1.343578,-.282180,-.061398],[-.065298,1.075788,-.010490],[.002822,-.019599,1.016777]];
    const expected=matrix.map(row=>{
      const v=row.reduce((sum,c,i)=>sum+c*sample.rgb[i],0)/203;
      return Math.sign(v)*(Math.abs(v)<=.0031308?12.92*Math.abs(v):1.055*Math.abs(v)**(1/2.4)-.055);
    });
    for (let channel=0;channel<3;channel++) {
      if (Math.abs(sample.pixel[channel]-expected[channel])>Math.max(.025,Math.abs(expected[channel])*.01)) throw Error('Incorrect color/luminance: '+JSON.stringify({sample,expected}));
    }
  }
  if (!(samples[1].pixel[0]>1.1 && samples[2].pixel[0]>samples[1].pixel[0])) throw Error('Highlights clipped: '+JSON.stringify(samples));
  // Hold one copy in flight and submit two replacements. The uploader must
  // close the superseded clone, retain at most two, and accept immediate
  // closure of every original decoder frame.
  const uploader=new HdrPlanes(device,await HdrPlanes.pipeline(device));
  const texture=device.createTexture({size:[2,2],format:'rgba16float',usage:GPUTextureUsage.RENDER_ATTACHMENT});
  let release;
  const gate=new Promise(resolve=>release=resolve);
  const clones=[];
  let copies=0;
  const jobs=[];
  for (let i=0;i<3;i++) {
    const video=new VideoFrame(new Uint16Array([723,723,723,723,512,512]),{format:'I420P10',codedWidth:2,codedHeight:2,timestamp:i,colorSpace:{primaries:'bt2020',transfer:'pq',matrix:'bt2020-ncl',fullRange:false}});
    const clone=video.clone.bind(video);
    video.clone=()=>{
      const owned=clone(),copy=owned.copyTo.bind(owned); clones.push(owned);
      owned.copyTo=async(...args)=>{ if (++copies===1) await gate; return copy(...args); };
      return owned;
    };
    jobs.push(uploader.draw(video,()=>texture.createView(),()=>true));
    video.close();
  }
  await jobs[1];
  if (copies!==1 || clones.filter(frame=>frame.codedWidth>0).length!==2 || clones[1].codedWidth!==0) throw Error('Unbounded frame queue or missing replacement cleanup');
  release(); await Promise.all(jobs);
  if (copies!==2 || clones.some(frame=>frame.codedWidth!==0)) throw Error('Frame lifetime leak');
  uploader.destroy();texture.destroy();
  const oddUploader=new HdrPlanes(device,await HdrPlanes.pipeline(device));
  const oddTexture=device.createTexture({size:[3,3],format:'rgba16float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC});
  const oddWords=new Uint16Array(17); oddWords.fill(500,0,9);
  oddWords.set([512,550,512,550],9);oddWords.set([512,600,512,600],13);
  const oddFrame=new VideoFrame(oddWords,{format:'I420P10',codedWidth:3,codedHeight:3,timestamp:0,colorSpace:{primaries:'bt2020',transfer:'pq',matrix:'bt2020-ncl',fullRange:false}});
  await oddUploader.draw(oddFrame,()=>oddTexture.createView(),()=>true);oddFrame.close();
  const oddRead=device.createBuffer({size:768,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
  const oddEncoder=device.createCommandEncoder();oddEncoder.copyTextureToBuffer({texture:oddTexture},{buffer:oddRead,bytesPerRow:256},[3,3]);device.queue.submit([oddEncoder.finish()]);
  await oddRead.mapAsync(GPUMapMode.READ);
  const oddPixel=Array.from(new Uint16Array(oddRead.getMappedRange()).slice(4,7),half);
  const y=(500-64)/876,u=(550-512)*.25/896,v=(600-512)*.25/896;
  const oddNits=[y+1.4746*v,y-.164553*u-.571353*v,y+1.8814*u].map(pq=>{
    const p=pq**(1/(2523/32));return (Math.max(p-3424/4096,0)/(2413/128-2392/128*p))**(1/(2610/16384))*10000;
  });
  const oddExpected=[[1.343578,-.282180,-.061398],[-.065298,1.075788,-.010490],[.002822,-.019599,1.016777]].map(row=>{
    const linear=row.reduce((sum,c,i)=>sum+c*oddNits[i],0)/203;
    return Math.sign(linear)*(Math.abs(linear)<=.0031308?12.92*Math.abs(linear):1.055*Math.abs(linear)**(1/2.4)-.055);
  });
  if (oddPixel.some((value,i)=>Math.abs(value-oddExpected[i])>.003)) throw Error('Odd-size chroma reconstruction failed: '+JSON.stringify({oddPixel,oddExpected}));
  oddRead.destroy();oddTexture.destroy();oddUploader.destroy();
  const path=hdrPresentationPath();
  let changes=0;
  window.addEventListener(HDR_CHANGED,()=>changes++);
  if (failure === "context") {
    const incompatible=document.createElement('canvas'); incompatible.getContext('2d');
    const words=new Uint16Array([723,723,723,723,512,512]);
    const video=new VideoFrame(words,{format:'I420P10',codedWidth:2,codedHeight:2,timestamp:0,colorSpace:{primaries:'bt2020',transfer:'pq',matrix:'bt2020-ncl',fullRange:false}});
    await drawHdr(incompatible,hdrFrame(video)); video.close();
  } else { device.destroy(); await device.lost; await Promise.resolve(); }
  if (changes !== 1) throw Error('Capability change event missing');
  if (await supportsHdr()) throw Error('Downgrade failed');
  document.querySelector('#result').textContent=JSON.stringify({ok:true,path,samples},null,2);
  return {ok:true,path,samples};
};
</script>
